services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: machinery_log_db
      POSTGRES_USER: machinery_log
      POSTGRES_PASSWORD: machinery_log
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: machinery-log
      MINIO_ROOT_PASSWORD: machinery-log-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
