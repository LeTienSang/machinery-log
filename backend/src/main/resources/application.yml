spring:
  application:
    name: machinery-log-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/machinery_log_db}
    username: ${SPRING_DATASOURCE_USERNAME:machinery_log}
    password: ${SPRING_DATASOURCE_PASSWORD:machinery_log}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
machinery-log:
  storage:
    endpoint: ${FILE_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${FILE_STORAGE_ACCESS_KEY:machinery-log}
    secret-key: ${FILE_STORAGE_SECRET_KEY:machinery-log-local}
    bucket: ${FILE_STORAGE_BUCKET:machinery-log-images}
  ocr:
    api-key: ${GEMINI_API_KEY:}
    endpoint: ${GEMINI_API_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
    timeout-ms: ${GEMINI_TIMEOUT_MS:30000}
    max-attempts: ${GEMINI_MAX_ATTEMPTS:3}
    initial-backoff-ms: ${GEMINI_INITIAL_BACKOFF_MS:1000}
    backoff-multiplier: ${GEMINI_BACKOFF_MULTIPLIER:2.0}
    max-requests-per-minute: ${GEMINI_MAX_REQUESTS_PER_MINUTE:15}
    enable-fallback: ${GEMINI_ENABLE_FALLBACK:true}
    max-image-bytes: ${GEMINI_MAX_IMAGE_BYTES:10485760}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
